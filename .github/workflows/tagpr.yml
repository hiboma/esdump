name: tagpr

on:
  push:
    branches:
      - master

# ジョブ単位で宣言し、将来ジョブを追加したときに権限が継承されないようにする
permissions: {}

jobs:
  tagpr:
    runs-on: ubuntu-latest
    permissions:
      # tagpr のタグ push と goreleaser の Release 作成
      contents: write
      # tagpr のリリース PR の作成と更新
      pull-requests: write
    steps:
      # persist-credentials は false にできない。tagpr が git で
      # リリースブランチとタグを push するため、.git/config の認証情報を
      # 必要とする。このジョブは artifact を上げず、外部から持ち込んだ
      # コードも実行しないため、トークンが持ち出される経路はない。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0

      - id: tagpr
        uses: Songmu/tagpr@7ebae2dcc300132baa7cc9dd108c8923b07fc366 # v1.20.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # tagpr が GITHUB_TOKEN で打ったタグは push イベントを発火しないため、
      # タグを打ったこのジョブ内で続けてリリースする
      #
      # cache は無効にする。ここはリリース成果物をビルドするジョブである。
      # PR のジョブが書き込んだビルドキャッシュを復元すると、汚染された
      # 中間オブジェクトが公開バイナリに混入する経路ができる
      # (cache poisoning)。リリースは年に数回であり、キャッシュを捨てて
      # 毎回クリーンにビルドする方が費用対効果が良い。
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: steps.tagpr.outputs.tag != ''
        with:
          go-version-file: go.mod
          cache: false

      - name: Run tests
        if: steps.tagpr.outputs.tag != ''
        run: go test -short ./...

      # goreleaser の sboms が syft を呼び出す。curl | bash は使わず、
      # バージョン固定 + checksum 照合で入れる。
      - name: Install syft
        if: steps.tagpr.outputs.tag != ''
        env:
          VERSION: 1.51.1
          SHA256: 8fcb33017a0dc1058298c923c436d19dfa68ae93968e0b423248542e3afb9fc3
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/anchore/syft/releases/download/v${VERSION}/syft_${VERSION}_linux_amd64.tar.gz" -o syft.tar.gz
          echo "${SHA256}  syft.tar.gz" | sha256sum -c -
          tar xf syft.tar.gz syft
          install -m 0755 syft /usr/local/bin/syft
          rm -f syft syft.tar.gz

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        if: steps.tagpr.outputs.tag != ''
        with:
          # 浮動範囲 (~> v2) にしない。リリース成果物を作るバイナリ自体が
          # 実行時に決まると、この workflow が他で徹底している固定が
          # 最後の一段で崩れる。更新は Dependabot が追えないため手動で
          # 上げる (goreleaser-action の SHA とは別に指定する必要がある)。
          version: "2.18.1"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
