name: tagpr

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  tagpr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - id: tagpr
        uses: Songmu/tagpr@7ebae2dcc300132baa7cc9dd108c8923b07fc366 # v1.20.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # tagpr が GITHUB_TOKEN で打ったタグは push イベントを発火しないため、
      # タグを打ったこのジョブ内で続けてリリースする
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: steps.tagpr.outputs.tag != ''
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        if: steps.tagpr.outputs.tag != ''
        run: go test -short ./...

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        if: steps.tagpr.outputs.tag != ''
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
