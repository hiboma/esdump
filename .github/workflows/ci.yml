name: ci

on:
  pull_request:
  push:
    branches:
      - master

# ジョブ単位で宣言し、将来ジョブを追加したときに権限が継承されないようにする
permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      # -short は Elasticsearch への接続を要するテストを飛ばす。
      # tagpr.yml も同じ指定でリリース時に走らせている。
      #
      # そちらは if: steps.tagpr.outputs.tag != '' で守られており、
      # リリースのときだけ動く。PR の時点では走らないため、壊れたまま
      # マージされてリリースで初めて気づくことになる。ここで塞ぐ。
      - name: Test
        run: go test -short ./...
